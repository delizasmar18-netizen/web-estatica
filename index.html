<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Web Estática</title>
  <link rel="stylesheet" href="css/styles.css">
  <meta name="version" content="1.0.1">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#servicios">Servicios</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <!-- Sección contacto (Rol de Minyer) -->
 <section id="contacto" class="contacto">
  <h2>Contáctanos</h2>
  <form>
    <div>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ejemplo: Juan Pérez" required>
    </div>
    <div>
      <label for="telefono">Correo:</label>
      <input type="telefono" id="telefono" name="telefono" placeholder="+51 999999999" required>
    </div>
    <div>
      <label for="email">Correo:</label>
      <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
    </div>
    <div>
      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
    </div>
    <button type="submit">Enviar</button>
  </form>
</section>
 



  <!-- Sección Footer (Rol de Luis) -->
  <footer>
    <p>&copy; 2026 Web Estática. Todos los derechos reservados.</p>
    <ul class="social-links">
      <li><a href="https://facebook.com" target="_blank">Facebook</a></li>
      <li><a href="https://twitter.com" target="_blank">Twitter</a></li>
      <li><a href="https://instagram.com" target="_blank">Instagram</a></li>
    </ul>
  </footer>
</body>
</html>
